spring.application.name=identity-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.fail-fast=false

# service discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15

# security: everything needs a bearer token except the auth endpoints
app.security.public-paths=/api/auth/**
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.ttl=${JWT_TTL:PT1H}

# password reminder
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
app.mail.from=no-reply@coolengineeringgames.local
app.frontend-url=${FRONTEND_URL:http://localhost:5500}
app.password-reset.ttl=PT30M

management.endpoints.web.exposure.include=health,info
management.health.mail.enabled=false

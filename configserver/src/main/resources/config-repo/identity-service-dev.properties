# identity-service -- dev profile
server.port=8081

spring.datasource.url=jdbc:h2:mem:ceg;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# dev-only signing secret so the stack runs without extra setup. Never reuse it outside local development.
app.security.jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-prod-0123456789abcdef}
app.password-reset.log-link=true
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@arizona.edu}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin-dev-12345}

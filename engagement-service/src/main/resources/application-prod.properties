# local fallback, mirrors configserver's engagement-service-prod.properties
server.port=8083

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://engagement-db:5432/engagement}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:engagement}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:engagement}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false

# no default: the service refuses to start without a signing secret
app.security.jwt.secret=${JWT_SECRET}

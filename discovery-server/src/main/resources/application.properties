spring.application.name=discovery-server
server.port=8761

# standalone registry: do not register with or fetch from another Eureka
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}

# a dead instance leaves the registry in seconds instead of minutes, so scaling down is visible quickly
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000
# serve the live registry instead of a copy refreshed every 30 seconds, so new instances show up at once
eureka.server.use-read-only-response-cache=false

management.endpoints.web.exposure.include=health,info

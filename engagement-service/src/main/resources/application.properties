spring.application.name=engagement-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.fail-fast=false

# service discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15

# security: every endpoint needs a bearer token
app.security.jwt.secret=${JWT_SECRET}

# the catalog is called by its Eureka name, so every running instance is found and load-balanced
app.catalog.url=http://game-catalog-service
# remember the instance list for 5s instead of the default 35s, so a crashed catalog instance leaves rotation quickly
spring.cloud.loadbalancer.cache.ttl=5s

# Spring Cloud wraps every breaker in a bulkhead that silently allows only 25 concurrent calls. Under load the
# extra calls would be rejected and counted as failures, opening the breaker on a healthy catalog.
spring.cloud.circuitbreaker.bulkhead.resilience4j.enabled=false

management.endpoints.web.exposure.include=health,info

# local fallback, mirrors configserver's identity-service-prod.properties
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://identity-db:5432/identity}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:identity}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:identity}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false

# no defaults: the service refuses to start without a signing secret
app.security.jwt.secret=${JWT_SECRET}
# the first administrator is only created when these are provided
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

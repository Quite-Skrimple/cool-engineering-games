spring:
  application:
    name: gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      fail-fast: false
    circuitbreaker:
      bulkhead:
        resilience4j:
          # Spring Cloud wraps every breaker in a bulkhead that silently allows only 25 concurrent calls per route.
          # Under real load the extra calls were rejected, counted as failures, and the breaker opened on a healthy service.
          enabled: false
    loadbalancer:
      cache:
        # how long the list of instances is remembered. The default is 35s, which kept sending a third of the
        # traffic to a crashed instance for that long after Eureka had already dropped it.
        ttl: 5s
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1000
            response-timeout: 10s
          routes:
            # Every route resolves its host through Eureka (lb://) and is guarded by a circuit breaker.
            # GETs are retried on another instance when one fails; writes are never retried.
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=/api/auth/**,/api/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: identity
                    fallbackUri: forward:/fallback/identity-service
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 500ms
                      factor: 2
                # writes are retried only when the connection itself failed: the request never reached a service,
                # so trying another instance cannot apply it twice. (series is set to a value that never happens so
                # that a 5xx answer is NOT retried for writes.)
                - name: Retry
                  args:
                    retries: 2
                    methods: POST,PUT,DELETE
                    series: REDIRECTION
                    exceptions: java.net.ConnectException,java.net.NoRouteToHostException
            - id: game-catalog-service
              uri: lb://game-catalog-service
              predicates:
                - Path=/api/games/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: catalog
                    fallbackUri: forward:/fallback/game-catalog-service
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 500ms
                      factor: 2
                # writes are retried only when the connection itself failed: the request never reached a service,
                # so trying another instance cannot apply it twice. (series is set to a value that never happens so
                # that a 5xx answer is NOT retried for writes.)
                - name: Retry
                  args:
                    retries: 2
                    methods: POST,PUT,DELETE
                    series: REDIRECTION
                    exceptions: java.net.ConnectException,java.net.NoRouteToHostException
            - id: engagement-service
              uri: lb://engagement-service
              predicates:
                - Path=/api/reactions/**,/api/library/**,/api/comments/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: engagement
                    fallbackUri: forward:/fallback/engagement-service
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 500ms
                      factor: 2
                # writes are retried only when the connection itself failed: the request never reached a service,
                # so trying another instance cannot apply it twice. (series is set to a value that never happens so
                # that a 5xx answer is NOT retried for writes.)
                - name: Retry
                  args:
                    retries: 2
                    methods: POST,PUT,DELETE
                    series: REDIRECTION
                    exceptions: java.net.ConnectException,java.net.NoRouteToHostException

server:
  port: 8000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      # lists the live routes; the gateway's security rules restrict /actuator/** (except health) to ADMIN
      access: read-only

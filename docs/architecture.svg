<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a2e">Cool Engineering Games — Deployment Architecture</text>

  <!-- Postman / client -->
  <rect x="380" y="52" width="240" height="46" rx="8" fill="#fff3cd" stroke="#e9a93b" stroke-width="2"/>
  <text x="500" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#5c4300">Postman Collection (client)</text>

  <!-- arrows from postman down to each service -->
  <path d="M430 98 L155 232" stroke="#8a6d1d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M500 98 L500 232" stroke="#8a6d1d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M570 98 L845 232" stroke="#8a6d1d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="240" y="170" font-size="12" fill="#5c4300">REST</text>
  <text x="730" y="170" font-size="12" fill="#5c4300">REST</text>

  <!-- Docker network (prod) boundary -->
  <rect x="20" y="118" width="960" height="330" rx="10" fill="#f3f6ff" stroke="#4361ee" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="36" y="140" font-size="13" font-weight="700" fill="#3043b0">Docker network: "cool-engineering-games"  (SPRING_PROFILES_ACTIVE=prod)</text>

  <!-- config server -->
  <rect x="380" y="152" width="240" height="56" rx="8" fill="#fde8c8" stroke="#d9872a" stroke-width="2"/>
  <text x="500" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#7a4a0a">configserver</text>
  <text x="500" y="194" text-anchor="middle" font-size="12" fill="#7a4a0a">:8888 — Spring Cloud Config (native, dev+prod)</text>

  <!-- dashed config-fetch arrows -->
  <path d="M430 208 L160 234" stroke="#d9872a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowSmall)"/>
  <path d="M500 208 L500 234" stroke="#d9872a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowSmall)"/>
  <path d="M570 208 L840 234" stroke="#d9872a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowSmall)"/>
  <text x="620" y="222" font-size="11" fill="#7a4a0a">fetch prod config at boot</text>

  <!-- service boxes -->
  <g>
    <rect x="40" y="236" width="230" height="78" rx="8" fill="#dbe4ff" stroke="#4361ee" stroke-width="2"/>
    <text x="155" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#2534a0">identity-service</text>
    <text x="155" y="278" text-anchor="middle" font-size="12" fill="#2534a0">:8081</text>
    <text x="155" y="296" text-anchor="middle" font-size="11" fill="#2534a0">owns: User (accounts, roles)</text>
  </g>
  <g>
    <rect x="385" y="236" width="230" height="78" rx="8" fill="#dbe4ff" stroke="#4361ee" stroke-width="2"/>
    <text x="500" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#2534a0">game-catalog-service</text>
    <text x="500" y="278" text-anchor="middle" font-size="12" fill="#2534a0">:8082</text>
    <text x="500" y="296" text-anchor="middle" font-size="11" fill="#2534a0">owns: Game (genre, approval)</text>
  </g>
  <g>
    <rect x="730" y="236" width="230" height="78" rx="8" fill="#dbe4ff" stroke="#4361ee" stroke-width="2"/>
    <text x="845" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#2534a0">engagement-service</text>
    <text x="845" y="278" text-anchor="middle" font-size="12" fill="#2534a0">:8083</text>
    <text x="845" y="296" text-anchor="middle" font-size="11" fill="#2534a0">owns: Reaction, LibraryEntry, Comment</text>
  </g>

  <!-- JDBC arrows down to each db -->
  <path d="M155 314 L155 360" stroke="#2a9d8f" stroke-width="2" fill="none" marker-end="url(#arrowTeal)"/>
  <path d="M500 314 L500 360" stroke="#2a9d8f" stroke-width="2" fill="none" marker-end="url(#arrowTeal)"/>
  <path d="M845 314 L845 360" stroke="#2a9d8f" stroke-width="2" fill="none" marker-end="url(#arrowTeal)"/>
  <text x="165" y="340" font-size="11" fill="#1d6e63">JDBC</text>
  <text x="510" y="340" font-size="11" fill="#1d6e63">JDBC</text>
  <text x="855" y="340" font-size="11" fill="#1d6e63">JDBC</text>

  <!-- db boxes -->
  <g>
    <rect x="40" y="362" width="230" height="64" rx="8" fill="#d4f1ee" stroke="#2a9d8f" stroke-width="2"/>
    <text x="155" y="386" text-anchor="middle" font-size="13" font-weight="700" fill="#17524a">identity-db</text>
    <text x="155" y="403" text-anchor="middle" font-size="11" fill="#17524a">Postgres 16 · volume: identity-db-data</text>
  </g>
  <g>
    <rect x="385" y="362" width="230" height="64" rx="8" fill="#d4f1ee" stroke="#2a9d8f" stroke-width="2"/>
    <text x="500" y="386" text-anchor="middle" font-size="13" font-weight="700" fill="#17524a">catalog-db</text>
    <text x="500" y="403" text-anchor="middle" font-size="11" fill="#17524a">Postgres 16 · volume: catalog-db-data</text>
  </g>
  <g>
    <rect x="730" y="362" width="230" height="64" rx="8" fill="#d4f1ee" stroke="#2a9d8f" stroke-width="2"/>
    <text x="845" y="386" text-anchor="middle" font-size="13" font-weight="700" fill="#17524a">engagement-db</text>
    <text x="845" y="403" text-anchor="middle" font-size="11" fill="#17524a">Postgres 16 · volume: engagement-db-data</text>
  </g>

  <text x="36" y="438" font-size="11" fill="#3043b0" font-style="italic">No shared tables, no cross-service joins — each bounded context keeps its own schema. Services only ever exchange plain ids (userId, gameId) over REST.</text>

  <!-- dev profile inset -->
  <rect x="20" y="470" width="960" height="270" rx="10" fill="#f8f9fa" stroke="#6c757d" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="36" y="494" font-size="13" font-weight="700" fill="#495057">dev profile (default, no Docker)  —  each service run directly with `mvn spring-boot:run`</text>

  <g>
    <rect x="60" y="516" width="230" height="78" rx="8" fill="#eef0f2" stroke="#6c757d" stroke-width="2"/>
    <text x="175" y="540" text-anchor="middle" font-size="14" font-weight="700" fill="#343a40">identity-service</text>
    <text x="175" y="558" text-anchor="middle" font-size="12" fill="#343a40">:8081</text>
    <text x="175" y="576" text-anchor="middle" font-size="11" fill="#343a40">H2 console: /h2-console</text>
  </g>
  <g>
    <rect x="385" y="516" width="230" height="78" rx="8" fill="#eef0f2" stroke="#6c757d" stroke-width="2"/>
    <text x="500" y="540" text-anchor="middle" font-size="14" font-weight="700" fill="#343a40">game-catalog-service</text>
    <text x="500" y="558" text-anchor="middle" font-size="12" fill="#343a40">:8082</text>
    <text x="500" y="576" text-anchor="middle" font-size="11" fill="#343a40">H2 console: /h2-console</text>
  </g>
  <g>
    <rect x="710" y="516" width="230" height="78" rx="8" fill="#eef0f2" stroke="#6c757d" stroke-width="2"/>
    <text x="825" y="540" text-anchor="middle" font-size="14" font-weight="700" fill="#343a40">engagement-service</text>
    <text x="825" y="558" text-anchor="middle" font-size="12" fill="#343a40">:8083</text>
    <text x="825" y="576" text-anchor="middle" font-size="11" fill="#343a40">H2 console: /h2-console</text>
  </g>

  <path d="M175 594 L175 620" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M500 594 L500 620" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M825 594 L825 620" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>

  <g>
    <rect x="80" y="622" width="190" height="42" rx="6" fill="#ffffff" stroke="#6c757d" stroke-width="1.5"/>
    <text x="175" y="648" text-anchor="middle" font-size="12" fill="#343a40">in-memory H2 (per service)</text>
  </g>
  <g>
    <rect x="405" y="622" width="190" height="42" rx="6" fill="#ffffff" stroke="#6c757d" stroke-width="1.5"/>
    <text x="500" y="648" text-anchor="middle" font-size="12" fill="#343a40">in-memory H2 (per service)</text>
  </g>
  <g>
    <rect x="730" y="622" width="190" height="42" rx="6" fill="#ffffff" stroke="#6c757d" stroke-width="1.5"/>
    <text x="825" y="648" text-anchor="middle" font-size="12" fill="#343a40">in-memory H2 (per service)</text>
  </g>

  <rect x="385" y="682" width="230" height="44" rx="8" fill="#fde8c8" stroke="#d9872a" stroke-width="2"/>
  <text x="500" y="700" text-anchor="middle" font-size="12" font-weight="700" fill="#7a4a0a">configserver :8888</text>
  <text x="500" y="715" text-anchor="middle" font-size="10" fill="#7a4a0a">optional — falls back to local .properties</text>
  <path d="M500 682 L500 664" stroke="#d9872a" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrowSmall2)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a6d1d"/></marker>
    <marker id="arrowSmall" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#d9872a"/></marker>
    <marker id="arrowSmall2" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#d9872a"/></marker>
    <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2a9d8f"/></marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6c757d"/></marker>
  </defs>
</svg>

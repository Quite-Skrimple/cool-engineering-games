# local fallback, mirrors configserver's engagement-service-dev.properties
server.port=8083

spring.datasource.url=jdbc:h2:mem:engagement;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# dev-only signing secret so the stack runs without extra setup. Never reuse it outside local development.
app.security.jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-prod-0123456789abcdef}
